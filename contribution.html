
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Team Contribution</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        #contributor-student-id {
            margin: 20px 0;
            font-weight: bold;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Team Contribution</h1>

        <button id="load-contributor">
            Show Contributor
        </button>

        <p id="contributor-student-id"></p>

        <a href="index.html">
            Back to Task Manager
        </a>
    </div>

    <script>
        document.getElementById("load-contributor")
            .addEventListener("click", async () => {
                const output = document.getElementById(
                    "contributor-student-id"
                );

                try {
                    const response = await fetch(
                        "contribution.json",
                        { cache: "no-store" }
                    );

                    if (!response.ok) {
                        throw new Error(
                            "Unable to load contributor data"
                        );
                    }

                    const data = await response.json();

                    if (!data.contributorStudentId) {
                        throw new Error(
                            "Contributor ID is missing"
                        );
                    }

                    output.textContent =
                        "Contributor Student ID: " +
                        data.contributorStudentId;

                } catch (error) {
                    output.textContent =
                        "Error: " + error.message;
                }
            });
    </script>

</body>
</html>
